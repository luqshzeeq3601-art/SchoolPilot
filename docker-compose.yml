services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: schoolpilot_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-schoolops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-schoolops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - schoolpilot_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: schoolpilot_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_LOG_LEVEL=debug
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-schoolops_32_character_key_123456}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n
      - uploaded_docs:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schoolpilot_network

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schoolpilot_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/schoolops}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/}
      - N8N_API_KEY=${N8N_API_KEY:-schoolops_n8n_secret_key_2026}
      - JWT_SECRET=${JWT_SECRET:-schoolops_jwt_secret_key_production_32chars_minimum}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5174,http://localhost:5173,http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
      - uploaded_docs:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - schoolpilot_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: schoolpilot_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    environment:
      - VITE_API_URL=http://localhost:8005
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - fastapi
    networks:
      - schoolpilot_network

volumes:
  postgres_data:
  n8n_data:
  uploaded_docs:

networks:
  schoolpilot_network:
    driver: bridge
